name: CI/CD Pipeline - Innovatech Chile

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech-frontend:latest -t $ECR_REGISTRY/innovatech-frontend:${{ github.sha }} frontend/
          docker push $ECR_REGISTRY/innovatech-frontend:latest
          docker push $ECR_REGISTRY/innovatech-frontend:${{ github.sha }}

      - name: Build y push Backend Ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech-backend-ventas:latest -t $ECR_REGISTRY/innovatech-backend-ventas:${{ github.sha }} backend-ventas/
          docker push $ECR_REGISTRY/innovatech-backend-ventas:latest
          docker push $ECR_REGISTRY/innovatech-backend-ventas:${{ github.sha }}

      - name: Build y push Backend Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech-backend-despachos:latest -t $ECR_REGISTRY/innovatech-backend-despachos:${{ github.sha }} backend-despachos/
          docker push $ECR_REGISTRY/innovatech-backend-despachos:latest
          docker push $ECR_REGISTRY/innovatech-backend-despachos:${{ github.sha }}

  deploy-ecs:
    name: Deploy en ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Frontend en ECS
        run: |
          aws ecs update-service \
            --cluster innovatech-clusteree \
            --service frontend-service \
            --force-new-deployment \
            --region us-east-1

      - name: Deploy Backend Despachos en ECS
        run: |
          aws ecs update-service \
            --cluster innovatech-clusteree \
            --service backend-despachos-service \
            --force-new-deployment \
            --region us-east-1

      - name: Deploy Backend Ventas en ECS
        run: |
          aws ecs update-service \
            --cluster innovatech-clusteree \
            --service backend-ventas-service \
            --force-new-deployment \
            --region us-east-1

      - name: Verificar deploy exitoso
        run: |
          echo "Deploy ECS completado en cluster innovatech-clusteree"
          echo "Commit: ${{ github.sha }}"
          echo "Hora: $(date)"
